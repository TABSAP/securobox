name: video_player_app
description: "SecuroBox is an offline media vault for videos, audio, photos and documents, protected by a PIN and biometrics."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  native_glass_navbar: ^1.2.0
  video_player: ^2.10.1
  shared_preferences: ^2.5.4
  local_auth: ^3.0.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  file_picker: ^10.3.8
  photo_manager: ^3.8.3
  share_plus: ^12.0.1
  path: ^1.9.1
  chewie: ^1.13.0
  syncfusion_flutter_pdfviewer: ^32.1.23
  just_audio: ^0.10.5
  audio_session: ^0.2.2
  intl: ^0.20.2
  flutter_secure_storage: ^10.0.0
  flutter_screenshot_blocker: ^1.0.2
  another_flushbar: ^1.12.32
  crypto: ^3.0.7
  url_launcher: ^6.3.1
  in_app_review: ^2.0.10
  package_info_plus: ^9.0.0
  flutter_email_sender: ^6.0.3
  pointycastle: ^3.9.1
  uuid: ^4.5.1
  camera: ^0.11.1
  google_mlkit_face_detection: ^0.13.2
  connectivity_plus: ^6.1.0
  flutter_native_splash: ^2.4.7
  video_thumbnail: ^0.5.6
  archive: ^4.0.9
  xml: ^6.6.1
  receive_sharing_intent: 1.8.1

dependency_overrides:
  native_glass_navbar:
    path: packages/native_glass_navbar

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0F23"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F0F23"
  image: assets/splash/logo.png
  android_12:
    color: "#0F0F23"
    image: assets/splash/logo.png
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/disguise/
    - assets/splash/
