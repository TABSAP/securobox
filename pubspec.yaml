name: video_player_app
description: "SecuroBox — offline media vault for videos, audio, photos & documents with PIN and biometric lock."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.10.1
  shared_preferences: ^2.5.4
  local_auth: ^3.0.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  file_picker: ^10.3.8
  photo_manager: ^3.8.3
  share_plus: ^12.0.1
  path: ^1.9.1
  chewie: ^1.13.0
  syncfusion_flutter_pdfviewer: ^32.1.23
  just_audio: ^0.10.5
  audio_session: ^0.2.2
  intl: ^0.20.2
  flutter_secure_storage: ^10.0.0
  flutter_screenshot_blocker: ^1.0.2
  another_flushbar: ^1.12.32
  crypto: ^3.0.7
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.0
  flutter_email_sender: ^6.0.3
  pointycastle: ^3.9.1
  uuid: ^4.5.1
  camera: ^0.11.1
  google_mlkit_face_detection: ^0.13.2
  connectivity_plus: ^6.1.0
  # Must stay in dependencies, not dev_dependencies: flutter_native_splash
  # ships a native Android plugin. As a dev_dependency the Flutter tool still
  # writes it into GeneratedPluginRegistrant.java, but Gradle skips building
  # its module, so the release build fails to compile. It is only used at
  # build time (splash codegen); the shipped native plugin is a tiny no-op.
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0F23"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F0F23"
  image: assets/splash/logo.png
  android_12:
    color: "#0F0F23"
    image: assets/splash/logo.png
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/disguise/
    - assets/splash/
